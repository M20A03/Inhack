<body class="bg-deep-forest text-on-surface font-body-lg min-h-screen pb-safe antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-deep-forest/60 backdrop-blur-md flex justify-between items-center px-margin-mobile h-touch-target border-b border-surface-variant">
<button aria-label="Open menu" class="text-primary hover:bg-surface-dark transition-colors active:scale-95 transition-transform duration-200 p-2 rounded-full flex items-center justify-center w-12 h-12">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-display-md text-display-md font-bold text-primary">Sahayak</h1>
<button aria-label="User profile avatar" class="hover:bg-surface-dark transition-colors active:scale-95 transition-transform duration-200 p-2 rounded-full flex items-center justify-center w-12 h-12">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold">U</div>
</button>
</header>
<!-- Main Content -->
<main class="pt-[100px] px-margin-mobile md:px-margin-desktop max-w-7xl mx-auto pb-32">
<!-- Greeting Section -->
<section class="mb-section-gap pt-8">
<h2 class="font-display-lg text-display-lg text-primary mb-4 leading-tight">
                Hello!<br/>
<span class="text-on-surface">How can I help you today?</span>
</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">
                Select an option below to get started with your accessibility tools.
            </p>
</section>
<!-- Bento Grid / Cards Section -->
<section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-element-gap">
<!-- Card 1: Voice Control -->
<button class="group text-left w-full bg-surface-dark rounded-xl p-6 border border-emerald-900/30 hover:border-secondary transition-all duration-300 relative overflow-hidden flex flex-col justify-between min-h-[240px]">
<div class="absolute -right-4 -top-4 w-32 h-32 bg-primary/10 rounded-full blur-2xl group-hover:bg-primary/20 transition-all"></div>
<div class="z-10">
<div class="w-16 h-16 bg-secondary-container text-on-secondary-container rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Voice Control</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Navigate and control the app using voice commands.</p>
</div>
</button>
<!-- Card 2: Scan Text -->
<button class="group text-left w-full bg-surface-dark rounded-xl p-6 border border-emerald-900/30 hover:border-secondary transition-all duration-300 relative overflow-hidden flex flex-col justify-between min-h-[240px]">
<div class="absolute -right-4 -top-4 w-32 h-32 bg-secondary/10 rounded-full blur-2xl group-hover:bg-secondary/20 transition-all"></div>
<div class="z-10">
<div class="w-16 h-16 bg-surface-variant text-primary rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Scan Text</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Read documents aloud using your device's camera.</p>
</div>
</button>
<!-- Card 3: Face Tracker -->
<button class="group text-left w-full bg-surface-dark rounded-xl p-6 border border-emerald-900/30 hover:border-secondary transition-all duration-300 relative overflow-hidden flex flex-col justify-between min-h-[240px] md:col-span-2 lg:col-span-1">
<div class="absolute -right-4 -top-4 w-32 h-32 bg-accent-gold/10 rounded-full blur-2xl group-hover:bg-accent-gold/20 transition-all"></div>
<div class="z-10">
<div class="w-16 h-16 bg-surface-variant text-accent-gold rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">face</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Face Tracker</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Use facial expressions and head movements to navigate.</p>
</div>
</button>
</section>
