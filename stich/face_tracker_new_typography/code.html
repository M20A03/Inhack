<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }

<body class="bg-deep-forest text-on-surface min-h-screen flex flex-col font-body-md antialiased overflow-x-hidden pb-[100px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-deep-forest/60 backdrop-blur-md border-b border-surface-variant flex justify-between items-center px-margin-mobile h-touch-target">
<button class="flex items-center justify-center w-12 h-12 text-on-surface-variant hover:bg-surface-dark transition-colors rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display-md text-display-md font-bold text-primary">Sahayak</h1>
<button class="flex items-center justify-center w-12 h-12 text-on-surface-variant hover:bg-surface-dark transition-colors rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="account_circle" style="font-size: 32px;">account_circle</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[100px] px-margin-mobile flex flex-col max-w-2xl mx-auto w-full">
<!-- Header Section -->
<div class="mb-section-gap mt-8">
<h2 class="font-display-md text-display-md text-off-white mb-2">Face Tracker</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Calibrate and monitor facial recognition functionality.</p>
</div>
<!-- Camera Tracking Canvas -->
<div class="relative w-full aspect-[3/4] bg-surface-dark rounded-xl border border-secondary shadow-lg overflow-hidden mb-element-gap">
<!-- Simulated Camera Feed Placeholder -->
<img class="absolute inset-0 w-full h-full object-cover opacity-80" data-alt="A simulated high-definition front-facing smartphone camera feed capturing a person's face in a moderately lit indoor environment. The image is rendered in a slightly desaturated, high-contrast editorial style consistent with a modern, dark-mode digital interface. Soft, natural light illuminates the subject's features clearly against a subtly blurred background to emphasize focus." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCK20t3DO1hUjyEPsOG5kXrb51tr-cK4zRWy99SAfom4sb5CXH5bihDcFB0CLaPWHk7G2jyPvUV1s9srCqTO7HEFzvPnWd3I3IrqVyGrzpZP1LPm27-_Jmv_tCjPBnLXKt2mJD3oAbAhb8b_H2QbLpEtnCzG6a_bvW_ROYsFDAW02VMBMt627bgiO-jjKyrVZDNstOhREYiTqQb_cvdeWbUKW_YE-qd25l6J2KBiOyugWjBa32bTlE"/>
<!-- Tracking Overlay HUD -->
<div class="absolute inset-0 z-10 pointer-events-none">
<!-- Golden Ratio/Rule of Thirds Subtle Grid -->
<div class="w-full h-full border-t border-b border-outline-variant/30 absolute top-1/3 bottom-1/3"></div>
<div class="w-full h-full border-l border-r border-outline-variant/30 absolute left-1/3 right-1/3"></div>
<!-- Active Bounding Box -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-48 h-64 border-2 border-accent-gold rounded-lg shadow-[0_0_50px_rgba(255,184,0,0.2)]">
<!-- Corner Brackets -->
<div class="absolute -top-1 -left-1 w-4 h-4 border-t-4 border-l-4 border-accent-gold"></div>
<div class="absolute -top-1 -right-1 w-4 h-4 border-t-4 border-r-4 border-accent-gold"></div>
<div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-4 border-l-4 border-accent-gold"></div>
<div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-4 border-r-4 border-accent-gold"></div>
</div>
<!-- HUD Details -->
<div class="absolute bottom-4 left-4 flex items-center space-x-2">
<span class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-secondary"></span>
</span>
<span class="font-label-md text-label-md text-secondary tracking-widest uppercase">Live Feed</span>
</div>
</div>
</div>
<!-- Status & Actions -->
<div class="flex flex-col items-center bg-surface p-6 rounded-xl border border-surface-variant">
<div class="flex items-center space-x-3 mb-6">
<span class="material-symbols-outlined text-secondary icon-fill" data-icon="check_circle">check_circle</span>
<span class="font-headline-md text-headline-md text-off-white">Tracking Active</span>
</div>
<button class="w-full h-touch-target rounded-[16px] bg-surface-variant hover:bg-surface-container-high transition-colors text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-outline">
<span class="material-symbols-outlined mr-2" data-icon="stop_circle">stop_circle</span>
                Stop Tracking
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-[88px] px-gutter pb-safe bg-deep-forest/60 backdrop-blur-md border-t border-surface-variant rounded-t-xl md:hidden">
<!-- Inactive: Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary active:scale-90 transition-transform w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-[12px] font-medium">Home</span>
</a>
<!-- Inactive: Voice -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary active:scale-90 transition-transform w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="mic">mic</span>
<span class="font-label-md text-[12px] font-medium">Voice</span>
</a>
<!-- Inactive: Scan -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary active:scale-90 transition-transform w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="document_scanner">document_scanner</span>
<span class="font-label-md text-[12px] font-medium">Scan</span>
</a>

<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl p-2 w-16 h-14 active:scale-90 transition-transform shadow-inner" href="#">
<span class="material-symbols-outlined mb-1 icon-fill" data-icon="face">face</span>
<span class="font-label-md text-[12px] font-bold">Face</span>
</a>
</nav>
